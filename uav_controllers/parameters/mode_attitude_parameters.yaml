uav::flight_mode:
  control_type:
    type: string
    read_only: true
    validation:
      one_of<>: [["attitude", "orientation"]]
    description:
      "Set the control interface types: attitude ('roll', 'pitch', 'angular_velocity.z') or orientation ('quaternion')."

  attitude:
    attitude_controller_name:
      type: string
      default_value: ""
      read_only: true
      description:
        "Name of controller that exports the command interfaces for 'roll' and 'pitch'."

    angular_velocity_controller_name:
      type: string
      default_value: ""
      read_only: true
      description:
        "Name of controller that exports the 'angular_velocity.z' command interface."

  orientation:
    controller_name:
      type: string
      default_value: ""
      read_only: true
      description:
        "Name of controller that exports the 'quaternion' command interfaces."

    sensor_name:
      type: string
      default_value: ""
      read_only: true
      description:
        "State estimator providing the orientation estimate."

  mixer:
    type: string
    read_only: true
    validation:
      not_empty<>: null
    description:
      "Name of controller that exports the 'thrust' command interface."

  rpyt_channels:
    type: int_array
    read_only: true
    validation:
      fixed_size<>: 4
    description:
      "RC channel IDs for roll, pitch, yaw, and throttle, in that order. These
      are used to identify the state interfaces in the namespace 'rc/channel/'"

  max_tilt:
    type: double
    default_value: 60
    read_only: true
    validation:
      bounds<>: [0, 90]
    description:
      "Maximum tilt angle in degrees."

  max_yaw_rate:
    type: double
    default_value: 180
    read_only: true
    validation:
      gt<>: 0
    description:
      "Maximum yaw rate in degrees per second."
